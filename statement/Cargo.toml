[package]
name = "spend-sha256"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Portable software SHA-256, the same crate and version the EVM route's
# precompile uses; no RISC-V hash extension or accelerator.
sha2 = { version = "=0.10.9", default-features = false }

[dev-dependencies]
serde_json = "1"
